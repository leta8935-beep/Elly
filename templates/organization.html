<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
        background: linear-gradient(135deg, #0f172a, #1e1b4b, #4c1d95);
        width: 900px; height: 500px; display: flex; align-items: center; justify-content: center;
    }
    .card {
        width: 820px; height: 420px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 40px;
        display: flex; gap: 40px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        position: relative; overflow: hidden;
    }
    .card::before {
        content: ''; position: absolute; top: -80px; right: -80px;
        width: 300px; height: 300px; background: rgba(139, 92, 246, 0.3);
        filter: blur(80px); border-radius: 50%;
    }
    .logo-sec {
        width: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-right: 1px solid rgba(255,255,255,0.1); padding-right: 40px; z-index: 1;
    }
    .logo {
        width: 200px; height: 200px; border-radius: 30px; object-fit: cover;
        border: 3px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        background: #1e293b;
    }
    .org-type {
        margin-top: 25px; padding: 8px 24px; background: rgba(255,255,255,0.1);
        border-radius: 20px; color: #c4b5fd; font-size: 14px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 1.5px;
    }
    .info-sec {
        flex: 1; display: flex; flex-direction: column; justify-content: center; z-index: 1;
    }
    .title { font-size: 42px; font-weight: 800; color: #fff; line-height: 1.1; margin-bottom: 8px; }
    .sphere { font-size: 16px; color: #94a3b8; font-weight: 500; margin-bottom: 40px; }
    
    .budget-box {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px; padding: 25px 30px; display: flex; flex-direction: column;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    }
    .budget-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1.5px; }
    .budget-value { font-size: 46px; font-weight: 800; color: #f8fafc; margin-top: 8px; display: flex; align-items: baseline; gap: 10px; }
    .budget-value span { font-size: 20px; color: #a78bfa; font-weight: 700; }
    
    .footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .owner { font-size: 15px; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
    .owner span { color: #e2e8f0; font-weight: 700; }
    .status { 
        background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; text-transform: uppercase;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="logo-sec">
            <img class="logo" id="logo" src="" alt="Logo">
            <div class="org-type" id="org_type">Бизнес</div>
        </div>
        <div class="info-sec">
            <div>
                <div class="title" id="org_name">Название</div>
                <div class="sphere" id="sphere">Сфера деятельности</div>
            </div>
            
            <div class="budget-box">
                <div class="budget-label">Бюджет организации</div>
                <div class="budget-value" id="balance">0 <span>RUB</span></div>
            </div>

            <div class="footer">
                <div class="owner">Владелец: <span id="owner">Игрок</span></div>
                <div class="status">Активна</div>
            </div>
        </div>
    </div>
    <script>
        window.renderData = (data) => {
            // Ставим заглушку, если логотип не указан или битый
            const logo = (data.logo_url && data.logo_url.startsWith('http')) ? data.logo_url : 'https://i.imgur.com/vHq5K9u.png';
            document.getElementById('logo').src = logo;
            document.getElementById('org_type').innerText = data.org_type;
            document.getElementById('org_name').innerText = data.name;
            document.getElementById('sphere').innerText = data.sphere;
            document.getElementById('balance').innerHTML = data.balance.toLocaleString('ru-RU') + ' <span>RUB</span>';
            document.getElementById('owner').innerText = data.owner;
        };
    </script>
</body>
</html>
