<!DOCTYPE html>
<html lang="ru">
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07070a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
    font-family: 'Inter', -apple-system, sans-serif;
  }
  .card {
    position: relative;
    width: 900px;
    background: linear-gradient(180deg, #0e0e13 0%, #08080b 100%);
    border-radius: 28px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 40px 120px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.03), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .card::before {
    content: '';
    position: absolute;
    top: -240px; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 500px;
    background: radial-gradient(ellipse, rgba(139,92,246,0.22), transparent 65%);
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: -200px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(ellipse, rgba(6,182,212,0.1), transparent 65%);
    pointer-events: none;
  }
  .noise {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.03; pointer-events: none; mix-blend-mode: overlay;
  }
  .content { padding: 44px 48px 40px; position: relative; z-index: 2; }
  .header {
    display: flex; align-items: center; gap: 22px;
    padding-bottom: 32px; margin-bottom: 32px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .logo-wrap { position: relative; flex-shrink: 0; }
  .logo {
    width: 84px; height: 84px; border-radius: 22px;
    background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(6,182,212,0.12));
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 32px;
    position: relative; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 4px rgba(255,255,255,0.02);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .logo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent 55%);
    pointer-events: none;
  }
  .brand-info { flex: 1; min-width: 0; }
  .brand-info h1 {
    color: #fff; font-size: 30px; font-weight: 700;
    letter-spacing: -0.035em; line-height: 1.15; margin-bottom: 8px;
  }
  .brand-meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 13px; font-weight: 500; color: #71717a;
  }
  .brand-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #3f3f46; }
  .main { display: grid; grid-template-columns: 200px 1fr; gap: 28px; margin-bottom: 28px; }
  .portrait {
    width: 200px; height: 240px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(139,92,246,0.1), transparent 60%), linear-gradient(135deg, #1a1a20, #0d0d11);
    border: 1px solid rgba(255,255,255,0.07);
    overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .portrait-silhouette {
    width: 100%; height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
    color: rgba(255,255,255,0.08);
  }
  .portrait-silhouette svg { width: 82%; height: 90%; }
  .info { display: flex; flex-direction: column; gap: 16px; }
  .balance-card {
    padding: 26px 30px;
    background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(6,182,212,0.05)), rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; position: relative; overflow: hidden;
  }
  .balance-card::before {
    content: ''; position: absolute; top: 0; left: 30px; right: 30px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139,92,246,0.7), rgba(6,182,212,0.7), transparent);
  }
  .balance-card::after {
    content: ''; position: absolute; top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(ellipse, rgba(6,182,212,0.15), transparent 70%);
    pointer-events: none;
  }
  .balance-label {
    font-size: 11px; font-weight: 600; color: #71717a;
    letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: 14px; position: relative; z-index: 2;
  }
  .balance-value {
    display: flex; align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 42px; color: #fff;
    letter-spacing: -0.03em; line-height: 1;
    position: relative; z-index: 2;
    text-shadow: 0 2px 20px rgba(139,92,246,0.25);
  }
  .owner-card {
    display: flex; align-items: center; gap: 16px;
    padding: 20px 24px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
    position: relative;
  }
  .owner-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(139,92,246,0.05));
    border: 1px solid rgba(139,92,246,0.25);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .owner-icon svg { width: 20px; height: 20px; stroke: #a78bfa; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .owner-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .owner-label { font-size: 10px; font-weight: 600; color: #71717a; letter-spacing: 0.14em; text-transform: uppercase; }
  .owner-name { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.015em; line-height: 1.2; }
  .owner-nick {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    font-weight: 500; color: #71717a; letter-spacing: 0.01em;
  }
  .owner-nick::before { content: '@'; color: #8b5cf6; margin-right: 1px; }
  .bottom-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 22px 26px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
  }
  .sphere-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(6,182,212,0.15), rgba(6,182,212,0.05));
    border: 1px solid rgba(6,182,212,0.25);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sphere-icon svg { width: 20px; height: 20px; stroke: #22d3ee; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sphere-text { display: flex; flex-direction: column; gap: 4px; }
  .sphere-label { font-size: 10px; font-weight: 600; color: #71717a; letter-spacing: 0.14em; text-transform: uppercase; }
  .sphere-value { font-size: 16px; font-weight: 600; color: #e4e4e7; letter-spacing: -0.015em; }
</style>
</head>
<body>
  <div class="card">
    <div class="noise"></div>
    <div class="content">
      <div class="header">
        <div class="logo-wrap">
          <div class="logo" id="org-logo">N</div>
        </div>
        <div class="brand-info">
          <h1 id="org-name">Организация</h1>
          <div class="brand-meta">
            <span>Основано в <span id="org-founded">2024</span></span>
            <span class="dot"></span>
            <span id="org-type">Бизнес</span>
          </div>
        </div>
      </div>
      <div class="main">
        <div class="portrait">
          <div class="portrait-silhouette">
            <svg viewBox="0 0 100 130" fill="currentColor">
              <path d="M 10 130 Q 15 82 32 72 L 40 68 L 60 68 L 68 72 Q 85 82 90 130 Z" opacity="0.9"/>
              <ellipse cx="50" cy="48" rx="20" ry="23" opacity="0.9"/>
            </svg>
          </div>
        </div>
        <div class="info">
          <div class="balance-card">
            <div class="balance-label">Баланс компании</div>
            <div class="balance-value" id="org-balance">0</div>
          </div>
          <div class="owner-card">
            <div class="owner-icon">
              <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div class="owner-info">
              <div class="owner-label">Владелец</div>
              <div class="owner-name" id="org-owner-name">Неизвестно</div>
              <div class="owner-nick" id="org-owner-nick"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="bottom-bar">
        <div class="sphere-icon">
          <svg viewBox="0 0 24 24">
            <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M9 17h1M14 9h1M14 13h1M14 17h1"/>
          </svg>
        </div>
        <div class="sphere-text">
          <div class="sphere-label">Сфера деятельности</div>
          <div class="sphere-value" id="org-sphere">Не указана</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.renderData = function (data) {
      if (!data) return;

      var nameEl = document.getElementById('org-name');
      var logoEl = document.getElementById('org-logo');
      var foundedEl = document.getElementById('org-founded');
      var typeEl = document.getElementById('org-type');
      var balanceEl = document.getElementById('org-balance');
      var ownerNameEl = document.getElementById('org-owner-name');
      var ownerNickEl = document.getElementById('org-owner-nick');
      var sphereEl = document.getElementById('org-sphere');

      if (data.name) {
        nameEl.textContent = data.name;
        logoEl.textContent = String(data.name).charAt(0).toUpperCase();
      }
      if (data.founded) foundedEl.textContent = data.founded;
      if (data.org_type) typeEl.textContent = data.org_type;
      if (data.balance !== undefined && data.balance !== null) {
        balanceEl.textContent = data.balance;
      }
      if (data.owner_name) ownerNameEl.textContent = data.owner_name;
      if (data.owner_nick) ownerNickEl.textContent = data.owner_nick;
      if (data.sphere) sphereEl.textContent = data.sphere;

      if (data.logo_url) {
        logoEl.innerHTML = '<img src="' + data.logo_url + '" alt="logo">';
      }
    };
  </script>
</body>
</html>
