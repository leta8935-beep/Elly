<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
        background: linear-gradient(135deg, #0f172a, #1e1b4b, #4c1d95);
        width: 900px; height: 500px; display: flex; align-items: center; justify-content: center;
    }
    .card {
        width: 820px; height: 420px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 40px;
        display: flex; gap: 30px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        position: relative; overflow: hidden;
    }
    .card::before {
        content: ''; position: absolute; top: -80px; right: -80px;
        width: 300px; height: 300px; background: rgba(139, 92, 246, 0.3);
        filter: blur(80px); border-radius: 50%;
    }
    .logo-sec {
        width: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-right: 1px solid rgba(255,255,255,0.1); padding-right: 30px; z-index: 1;
    }
    .logo {
        width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
        border: 3px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        background: #1e293b;
    }
    .org-type {
        margin-top: 20px; padding: 6px 18px; background: rgba(255,255,255,0.1);
        border-radius: 20px; color: #c4b5fd; font-size: 13px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 1px;
    }
    .info-sec {
        flex: 1; display: flex; flex-direction: column; justify-content: space-between; z-index: 1;
    }
    .title { font-size: 34px; font-weight: 800; color: #fff; line-height: 1.1; }
    .sphere { font-size: 15px; color: #94a3b8; font-weight: 500; margin-top: 6px; }
    .stats {
        display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px;
    }
    .stat-box {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px; padding: 15px 20px;
    }
    .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
    .stat-value { font-size: 24px; font-weight: 800; color: #f8fafc; margin-top: 4px; }
    .stat-value span { font-size: 14px; color: #a78bfa; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .owner { font-size: 14px; color: #94a3b8; }
    .owner span { color: #e2e8f0; font-weight: 600; }
    .level-badge {
        background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff;
        padding: 6px 16px; border-radius: 20px; font-weight: 800; font-size: 14px;
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }
</style>
</head>
<body>
    <div class="card">
        <div class="logo-sec">
            <img class="logo" id="logo" src="" alt="Logo">
            <div class="org-type" id="org_type">Бизнес</div>
        </div>
        <div class="info-sec">
            <div>
                <div class="title" id="org_name">Название</div>
                <div class="sphere" id="sphere">Сфера деятельности</div>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Доход в час</div>
                    <div class="stat-value" id="income">0 <span>RUB</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Накоплено</div>
                    <div class="stat-value" id="acc">0 <span>RUB</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Бюджет организации</div>
                    <div class="stat-value" id="balance">0 <span>RUB</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Уровень</div>
                    <div class="stat-value" id="level">LVL 1</div>
                </div>
            </div>
            <div class="footer">
                <div class="owner">Владелец: <span id="owner">Игрок</span></div>
                <div class="level-badge" id="level_badge">LVL 1</div>
            </div>
        </div>
    </div>
    <script>
        window.renderData = (data) => {
            document.getElementById('logo').src = data.logo_url || 'https://i.imgur.com/vHq5K9u.png';
            document.getElementById('org_type').innerText = data.org_type;
            document.getElementById('org_name').innerText = data.name;
            document.getElementById('sphere').innerText = data.sphere;
            document.getElementById('income').innerHTML = data.income.toLocaleString('ru-RU') + ' <span>RUB</span>';
            document.getElementById('acc').innerHTML = data.acc.toLocaleString('ru-RU') + ' <span>RUB</span>';
            document.getElementById('balance').innerHTML = data.balance.toLocaleString('ru-RU') + ' <span>RUB</span>';
            document.getElementById('level').innerText = 'LVL ' + data.level;
            document.getElementById('level_badge').innerText = 'LVL ' + data.level;
            document.getElementById('owner').innerText = data.owner;
        };
    </script>
</body>
</html>
