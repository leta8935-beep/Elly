<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экспорт чата — %%CHANNEL_NAME%%</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --text-normal:  #dbdee1;
  --text-muted:   #949ba4;
  --text-strong:  #f2f3f5;
  --text-link:    #00a8fc;
  --hover-bg:     rgba(4, 4, 5, 0.07);
  --reply-line:   #4e5058;
  --mention-bg:   rgba(88, 101, 242, 0.30);
  --mention-text: #dee0fc;
  --code-bg:      rgba(0, 0, 0, 0.30);
  --divider:      rgba(255, 255, 255, 0.08);
  --font: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  background: #07070a;
}
body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.375rem;
  color: var(--text-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 24px;
}

.chat {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 0 24px;
}

.message {
  position: relative;
  display: flex;
  padding: 2px 48px 2px 16px;
  transition: background-color .1s ease;
}
.message:hover { background: var(--hover-bg); }
.message.first { margin-top: 17px; }
.message.grouped { padding-left: 72px; }

.avatar {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  margin-right: 16px;
  margin-top: 2px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  letter-spacing: .02em;
  user-select: none;
  overflow: hidden;
  background: #5865f2;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.content { flex: 1 1 auto; min-width: 0; }

.header {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0 .25rem;
}
.username {
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.375rem;
  color: var(--text-strong);
}
.username:hover { text-decoration: underline; }
.timestamp {
  font-size: .75rem;
  line-height: 1.375rem;
  color: var(--text-muted);
  margin-left: .25rem;
  white-space: nowrap;
}
.bot-tag {
  align-self: center;
  background: #5865f2;
  color: #fff;
  font-size: .625rem;
  font-weight: 600;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 3px;
  margin-left: .25rem;
  text-transform: uppercase;
  letter-spacing: .02em;
}

.text {
  color: var(--text-normal);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.hover-time {
  position: absolute;
  left: 0;
  top: 2px;
  width: 72px;
  text-align: center;
  font-size: .6875rem;
  line-height: 1.375rem;
  color: var(--text-muted);
  opacity: 0;
  pointer-events: none;
  user-select: none;
  transition: opacity .1s ease;
}
.message.grouped:hover .hover-time { opacity: 1; }

.divider {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 24px 16px 8px;
  color: var(--text-muted);
  font-size: .75rem;
  font-weight: 600;
  line-height: 1.25rem;
}
.divider::before,
.divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--divider);
}

.reply {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 2px;
  padding-left: 10px;
  font-size: .875rem;
  line-height: 1.125rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.reply::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 6px;
  height: 6px;
  border-left: 2px solid var(--reply-line);
  border-top: 2px solid var(--reply-line);
  border-top-left-radius: 3px;
  transform: translateY(-50%);
}
.reply .r-author { color: #c9cdfb; font-weight: 500; }

.mention {
  background: var(--mention-bg);
  color: var(--mention-text);
  border-radius: 3px;
  padding: 0 2px;
  font-weight: 500;
}
.mention:hover { background: #5865f2; color: #fff; }

.code {
  font-family: Consolas, "Andale Mono WT", Menlo, monospace;
  font-size: .85em;
  background: var(--code-bg);
  padding: 1px 4px;
  border-radius: 4px;
}
.code-block {
  font-family: Consolas, "Andale Mono WT", Menlo, monospace;
  font-size: .85em;
  background: rgba(0, 0, 0, 0.4);
  padding: 10px 12px;
  border-radius: 6px;
  margin: 6px 0;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: auto;
}
.code-block code { background: none; padding: 0; }

.link { color: var(--text-link); text-decoration: none; }
.link:hover { text-decoration: underline; }

.emoji {
  width: 22px;
  height: 22px;
  vertical-align: -0.3em;
  display: inline;
}

.attachment { margin: 6px 0; }
.attachment img {
  display: block;
  max-width: 400px;
  max-height: 400px;
  border-radius: 8px;
}

.embed {
  background: rgba(0, 0, 0, 0.2);
  border-left: 4px solid #4e5058;
  padding: 10px 14px;
  border-radius: 4px;
  margin: 6px 0;
  max-width: 500px;
}
.embed-author { font-size: .875rem; font-weight: 600; color: var(--text-strong); margin-bottom: 4px; }
.embed-title { font-size: 1rem; font-weight: 600; color: var(--text-strong); margin-bottom: 6px; }
.embed-desc { font-size: .9375rem; margin-bottom: 8px; }
.embed-field { margin-bottom: 6px; }
.embed-field-name { font-size: .8125rem; font-weight: 600; color: var(--text-strong); }
.embed-field-value { font-size: .875rem; }
.embed-image { max-width: 100%; border-radius: 4px; margin-top: 8px; }
.embed-thumb { max-width: 80px; border-radius: 4px; float: right; margin-left: 8px; }
.embed-footer { font-size: .75rem; color: var(--text-muted); margin-top: 8px; clear: both; }

.reactions {
  margin-top: 6px;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.reaction {
  background: rgba(88, 101, 242, 0.15);
  border: 1px solid rgba(88, 101, 242, 0.3);
  border-radius: 6px;
  padding: 2px 6px;
  font-size: .8125rem;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

/* ---------- PRINT / PDF ---------- */
@media print {
  body {
    background: #07070a;
    padding: 0;
  }
  .chat { max-width: 100%; padding: 0; }
  .message { page-break-inside: avoid; }
  .message:hover { background: transparent; }
  .message.grouped:hover .hover-time { opacity: 0; }
  .mention:hover { background: var(--mention-bg); color: var(--mention-text); }
  .username:hover { text-decoration: none; }
  .link:hover { text-decoration: none; }
}
</style>
</head>
<body>

<div class="chat">
%%MESSAGES%%
</div>

</body>
</html>
